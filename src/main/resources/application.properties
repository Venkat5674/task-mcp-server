spring.application.name=mcp-server
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:taskpilot}?sslmode=${DATABASE_SSL_MODE:prefer}}
spring.datasource.username=${DATABASE_USERNAME:taskpilot}
spring.datasource.password=${DATABASE_PASSWORD:taskpilot}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
app.jwt.expiration=${JWT_EXPIRATION:PT1H}
app.auth.username=${AUTH_USERNAME:admin}
app.auth.password=${AUTH_PASSWORD:change-me}
